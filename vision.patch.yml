# dsh-vision 宿主 + 客户端插件挂载（加入你 profile 的 cordis.patch.yml）
#
# ★ 推荐：直接双击 install.bat（或运行 node install.mjs），它会自动把 dsh-vision 复制进
#   profile 的 node_modules，并写入下面这行，无需手动操作。
#
# 关键：host + client 插件（这一行）的 name 必须用「包名」，且插件要位于 profile 的
#   node_modules/dsh-vision 下（DSH 主 Loader 不转换绝对路径，只有 agent preset 才支持绝对路径）。

- insert:
    - id: vision
      name: 'dsh-vision'
